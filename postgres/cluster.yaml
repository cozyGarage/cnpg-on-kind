# CloudNativePG Cluster — a 2-instance HA PostgreSQL (1 primary + 1 replica).
#
# This is the heart of the demo. Every block is commented.
# verify against cloudnative-pg.io docs for your installed operator version:
#   https://cloudnative-pg.io/documentation/current/cloudnative-pg.v1/
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-demo
  namespace: cnpg-demo
spec:
  # ---- High availability -------------------------------------------------
  # 2 instances = 1 primary + 1 streaming replica. The operator handles
  # promotion/failover. (Production: use 3+; see README "What I'd change".)
  instances: 2

  # ---- Image (pinned) ----------------------------------------------------
  # Pin an explicit minor tag — never use a floating tag for a system of record.
  # CNPG publishes multi-arch images (arm64 available for Apple Silicon).
  # Browse tags: https://github.com/cloudnative-pg/postgres-containers/pkgs/container/postgresql
  # verify the exact tag exists for your operator version before applying.
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2

  # ---- Resource budget (small, to fit an 8 GB laptop) --------------------
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      # No CPU limit on purpose (avoid CFS throttling); cap memory.
      memory: "512Mi"

  # ---- Storage -----------------------------------------------------------
  # kind ships a default StorageClass named "standard" (rancher local-path).
  storage:
    size: 1Gi
    storageClass: standard

  # ---- Bootstrap ---------------------------------------------------------
  # Fresh init: create database `app` owned by role `app`.
  # The `app` role's password comes from a Secret created imperatively
  # (see secrets/README.md). CNPG also auto-generates one if omitted.
  bootstrap:
    initdb:
      database: app
      owner: app
      # secret:
      #   name: cnpg-demo-app-user   # uncomment to use your own credentials Secret

  # ---- Monitoring --------------------------------------------------------
  # Operator creates a PodMonitor so Prometheus can scrape per-instance metrics
  # (cnpg_pg_replication_lag, cnpg_backends_total, etc.) on :9187/metrics.
  monitoring:
    enablePodMonitor: true

  # ---- PostgreSQL tuning -------------------------------------------------
  # Conservative settings for a small box, plus the observability knobs that
  # matter when diagnosing a payments DB.
  postgresql:
    parameters:
      # Memory (tiny on purpose for the laptop demo).
      shared_buffers: "128MB"
      max_connections: "100"
      # Log statements slower than 250ms — the single most useful slow-query knob.
      log_min_duration_statement: "250ms"
      # Log every checkpoint so you can correlate I/O spikes.
      log_checkpoints: "on"
      # Log when a session waits on a lock past deadlock_timeout — catches contention.
      log_lock_waits: "on"
      # Log connections/disconnections (useful with the pooler).
      log_connections: "on"
      log_disconnections: "on"

  # ---- Backup target (object store) -------------------------------------
  # The actual barmanObjectStore block lives in backup/object-store.yaml,
  # which patches this Cluster's spec.backup. Keeping it separate keeps this
  # file readable and lets you apply the DB before wiring up MinIO.
  # See backup/object-store.yaml.
