# CNPG ScheduledBackup — periodic base backups on a cron schedule.
# WAL archiving (continuous) is configured via the Cluster's barmanObjectStore;
# this schedules the periodic *base* backups that PITR anchors to.
# verify against cloudnative-pg.io docs for your installed operator version:
#   https://cloudnative-pg.io/documentation/current/backup/#scheduled-backups
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: cnpg-demo-daily
  namespace: cnpg-demo
spec:
  # CNPG uses a 6-field cron (seconds first). "0 0 2 * * *" = 02:00 every day.
  schedule: "0 0 2 * * *"
  # Don't run immediately on creation (flip to true to take one right away).
  immediate: false
  # Target the cluster created in postgres/cluster.yaml.
  cluster:
    name: cnpg-demo
  # Use the object-store method (matches barmanObjectStore in object-store.yaml).
  method: barmanObjectStore
